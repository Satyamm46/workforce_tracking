# =========================================================
#  BASE CONFIGURATION  (shared by every environment)
#  Environment-specific values live in application-dev /
#  application-prod and OVERRIDE the values here.
# =========================================================

# ----- Application identity -----
spring.application.name=workforce-tracking

# ----- Active profile -----
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ----- Server -----
# PORT is injected by the host when it assigns one; falls back to 8080 locally.
server.port=${PORT:8080}
server.servlet.context-path=/api

# ----- Custom application banner -----
spring.banner.location=classpath:banner.txt

# =========================================================
#  JPA / HIBERNATE  (common behavior; ddl-auto set per profile)
# =========================================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
#  JACKSON (JSON serialization) — Jackson 3 compatible
# =========================================================
# Do not serialize null fields -> cleaner API responses
spring.jackson.default-property-inclusion=non_null
# Tolerate unknown JSON properties from clients
spring.jackson.deserialization.fail-on-unknown-properties=false

# =========================================================
#  TIME ZONE
# =========================================================
spring.jackson.time-zone=Asia/Kolkata

# =========================================================
#  JWT (placeholders — consumed by JwtUtil later)
# =========================================================
# DEV-ONLY default below — NOT a real secret. Production MUST set JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktcGxhY2Vob2xkZXItc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# =========================================================
#  CORS (consumed by WebConfig later)
# =========================================================
# Comma-separated. In prod set CORS_ALLOWED_ORIGINS to your Vercel URL(s).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================================================
#  MAIL (placeholders — real values per profile)
# =========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
# Real credentials come from env vars. Empty defaults keep secrets out of git.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast instead of hanging forever. Without these, a blocked or dropped SMTP
# egress leaves send() blocking indefinitely, so the HTTP request never returns
# and the browser reports a network error. Kept well under the frontend's 15 s
# request timeout, since JavaMail may retry each IP the host resolves to.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =========================================================
#  ACTUATOR (health endpoint support)
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

management.health.mail.enabled=false

management.health.ssl.enabled=false

management.health.diskspace.threshold=1MB

# =========================================================
#  INITIAL DATA SEEDING (first Super Admin)
#  Overridden by environment variables in production.
# =========================================================
app.seed.super-admin.email=${SEED_ADMIN_EMAIL:}
# No default: an empty value makes DataSeeder refuse to seed rather than create
# a Super Admin with a blank password. Set SEED_ADMIN_PASSWORD in the environment.
app.seed.super-admin.password=${SEED_ADMIN_PASSWORD:}
app.seed.super-admin.full-name=${SEED_ADMIN_FULL_NAME:Satyam Kumar}

# =========================================================
#  LEAVE MANAGEMENT
# =========================================================
# Annual leave allowance in days, per employee, per calendar year.
app.leave.annual-allowance-days=48

app.push.vapid.public-key=${VAPID_PUBLIC_KEY:BNCqhDzj_beXr5Ef5ugznKc8n5O738BPwgyrn-JgjQqR8CZgebB7bBCONNJIcupF8UkLXLORSR6Fg__hFrzowGE}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:mailto:sknink4@gmail.com}

app.attendance.offline-grace-seconds=90
app.attendance.auto-checkout-break-minutes=30
